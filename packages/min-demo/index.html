<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyChat 最小演示：端到端加密 + 零信任节点</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; background: #10141c; color: #dfe6f0; }
      .topbar { padding: 10px 18px; background: #1a2130; border-bottom: 1px solid #2a3346; font-size: 13px; color: #9fb0c9; }
      .cols { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 10px; padding: 10px; height: calc(100vh - 42px); }
      .col { background: #1a2130; border: 1px solid #2a3346; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
      .col h2 { font-size: 15px; color: #7fd0a0; }
      .nodecol h2 { color: #e8b45a; }
      .nodecol { background: #241d12; }
      .status { font-size: 11px; color: #9fb0c9; word-break: break-all; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .input { flex: 1 1 90px; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a4560; background: #10141c; color: #dfe6f0; font-size: 13px; }
      .btn { padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4560; background: #26314a; color: #dfe6f0; cursor: pointer; font-size: 13px; }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn:not(:disabled):hover { background: #31405f; }
      .chat { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      .chat-head { font-size: 12px; color: #9fb0c9; border-bottom: 1px dashed #3a4560; padding-bottom: 4px; }
      .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 4px 0; }
      .msg { display: flex; }
      .msg.in { justify-content: flex-start; }
      .msg.out { justify-content: flex-end; }
      .bubble { max-width: 82%; padding: 6px 10px; border-radius: 10px; background: #26314a; font-size: 13px; word-break: break-all; }
      .msg.out .bubble { background: #1f4a35; }
      .chat-row { display: flex; gap: 6px; }
      .log { height: 168px; overflow-y: auto; font-size: 11px; color: #8fa3c0; background: #10141c; border-radius: 6px; padding: 6px; white-space: pre-wrap; }
      .hint { font-size: 12px; color: #c9b08a; }
      .mailbox-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .mailbox-card { border: 1px solid #4a3d22; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
      .mailbox-id { font-size: 12px; color: #e8b45a; }
      .mailbox-empty { font-size: 11px; color: #7c6d4d; }
      .envelope-json { font-size: 11px; color: #d3a86b; background: #16110a; border-radius: 4px; padding: 3px 5px; word-break: break-all; cursor: help; }
    </style>
  </head>
  <body>
    <div class="topbar">MyChat 最小演示</div>
    <div class="cols"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
